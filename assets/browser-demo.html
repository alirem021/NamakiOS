<!doctype html><html lang="en"><meta charset="utf-8"><title>JavaScript Demo</title>
<style>body{margin:0;background:#eef4ff;color:#152443;font:18px system-ui}main{padding:28px}h1{margin:0 0 12px}p{margin:12px 0}button{display:block;position:absolute;left:28px;top:166px;width:150px;height:48px;background:#2563eb;border:0;border-radius:12px;color:white;font:18px system-ui;cursor:pointer}input{display:block;margin-top:86px;padding:14px;border-radius:10px;border:1px solid #b0c0dd;font:inherit}#echo{color:#2563eb}.box{margin-top:28px;background:linear-gradient(110deg,#2563eb,#ac57ed);border-radius:20px;padding:24px;color:white}section{height:600px;padding-top:28px}</style>
<main><h1>JavaScript is running.</h1><p>Clicks: <strong id="counter">0</strong></p><p>Real DOM events, CSS gradients and Persian text: سلام دنیا</p>
<button id="increment">Add one</button><input id="text" placeholder="Type here"><p id="echo">Your text appears here</p>
<div class="box">Rendered by Chromium. Controlled from NamakiOS.</div><section>Scroll down to test the mouse wheel.<p id="clock"></p></section><a href="browser-home.html">Back home</a></main>
<script>let n=0;document.querySelector('#increment').onclick=()=>document.querySelector('#counter').textContent=++n;document.querySelector('#text').oninput=e=>document.querySelector('#echo').textContent=e.target.value;setInterval(()=>document.querySelector('#clock').textContent=new Date().toLocaleTimeString(),1000)</script></html>
